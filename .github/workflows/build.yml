name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build universal app and icon
        run: bash scripts/build.sh
      - name: Test window behavior and package integrity
        run: bash scripts/test.sh
      - name: Package ZIP and checksum
        run: bash scripts/package.sh
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Separate-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 7
